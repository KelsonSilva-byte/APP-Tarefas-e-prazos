<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas e Prazos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="workspace">
    <header class="page-header">
        <div>
            <h1>Tarefas e Prazos</h1>
            <p class="subtitle">Ordenação automática por proximidade de entrega e relevância.</p>
        </div>
        <div class="header-actions">
            <button id="btnBackupModal" class="btn-secondary">Dados</button>
            <button id="btnNotify" class="btn-secondary">Notificações</button>
            <button id="btnToggleFilter" class="btn-secondary btn-filter" title="Filtrar">Filtrar <span id="filterBadge">0</span></button>
        </div>
    </header>

    <div id="alertBanner" class="alert-banner" role="alert"></div>

    <!-- Gaveta Retrátil de Busca e Filtros (v1.4) -->
    <section id="filterDrawer" class="filter-drawer">
        <div class="filter-drawer-inner">
            <div class="filter-search">
                <input type="text" id="searchInput" placeholder="Buscar tarefa..." autocomplete="off">
            </div>
            <div class="filter-selects">
                <select id="filterCategory">
                    <option value="">Categoria</option>
                    <option value="Atividade">Atividade</option>
                    <option value="Compromisso">Compromisso</option>
                    <option value="Prazo">Prazo</option>
                </select>
                <select id="filterUrgency">
                    <option value="">Prioridade</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                    <option value="Crítica">Crítica</option>
                </select>
                <select id="filterDeadline">
                    <option value="">Prazo</option>
                    <option value="today">Hoje</option>
                    <option value="week">Esta semana</option>
                    <option value="month">Este mês</option>
                </select>
            </div>
        </div>
    </section>

    <section class="composer">
        <form id="taskForm">
            <div class="input-primary">
                <input type="text" id="title" placeholder="Adicionar compromisso ou atividade..." autocomplete="off" required>
            </div>
            <div class="input-properties">
                <div class="prop-group">
                    <label for="category">Tipo</label>
                    <select id="category">
                        <option value="Atividade">Atividade</option>
                        <option value="Compromisso">Compromisso</option>
                        <option value="Prazo">Prazo</option>
                    </select>
                </div>
                <div class="prop-group">
                    <label for="importance">Relevância</label>
                    <select id="importance">
                        <option value="1">Baixa</option>
                        <option value="2" selected>Média</option>
                        <option value="3">Alta</option>
                    </select>
                </div>
                <div class="prop-group">
                    <label for="deadline">Vencimento</label>
                    <input type="datetime-local" id="deadline" required>
                </div>
                <button type="submit" class="btn-primary">Adicionar</button>
            </div>
        </form>
    </section>

    <section class="list-section">
        <div class="list-header">
            <span>Item</span>
            <span>Prioridade e Prazo</span>
        </div>
        <div id="taskList" class="task-list"></div>
    </section>
</main>

<!-- Toast de Desfazer (v1.1) -->
<div id="undoToast" class="undo-toast" role="status">
    <span id="undoMessage">Tarefa concluída.</span>
    <button id="btnUndo" class="btn-undo">Desfazer</button>
</div>

<!-- Modal de Backup e Restauração (v1.2) -->
<div id="backupModal" class="modal-backdrop">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Backup e Restauração</h2>
            <button id="btnCloseModal" class="btn-icon">✕</button>
        </div>
        <p class="modal-desc">Exporte suas tarefas em formato JSON para salvar ou transferir para outro aparelho.</p>
        
        <div class="modal-actions-row">
            <button id="btnCopyJson" class="btn-secondary">Copiar JSON</button>
            <button id="btnDownloadJson" class="btn-secondary">Baixar .json</button>
            <label for="fileImportJson" class="btn-secondary btn-file-label">Carregar .json</label>
            <input type="file" id="fileImportJson" accept=".json,application/json" style="display:none;">
        </div>

        <textarea id="backupTextarea" class="backup-textarea" rows="6" placeholder="O código JSON de backup aparecerá aqui ou cole um backup existente para restaurar..."></textarea>
        
        <div id="backupFeedback" class="backup-feedback"></div>

        <div class="modal-footer">
            <button id="btnImportText" class="btn-primary">Restaurar Tarefas</button>
        </div>
    </div>
</div>

<!-- Modal de Edição Rápida (v1.3) -->
<div id="editModal" class="modal-backdrop">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Editar Tarefa</h2>
            <button type="button" id="btnCloseEditModal" class="btn-icon">✕</button>
        </div>

        <form id="editTaskForm">
            <div class="input-primary">
                <input type="text" id="editTitle" placeholder="Título da atividade..." autocomplete="off" required>
            </div>
            <div class="input-properties">
                <div class="prop-group">
                    <label for="editCategory">Tipo</label>
                    <select id="editCategory">
                        <option value="Atividade">Atividade</option>
                        <option value="Compromisso">Compromisso</option>
                        <option value="Prazo">Prazo</option>
                    </select>
                </div>
                <div class="prop-group">
                    <label for="editImportance">Relevância</label>
                    <select id="editImportance">
                        <option value="1">Baixa</option>
                        <option value="2">Média</option>
                        <option value="3">Alta</option>
                    </select>
                </div>
                <div class="prop-group">
                    <label for="editDeadline">Vencimento</label>
                    <input type="datetime-local" id="editDeadline" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>

<script src="storage.js"></script>
<script src="priority.js"></script>
<script src="notifications.js"></script>
<script src="ui.js"></script>
<script src="backup.js"></script>
<script src="edit.js"></script>
<script src="filters.js"></script>
<script src="app.js"></script>
</body>
</html>
